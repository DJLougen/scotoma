[package]
name = "scotoma-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PHI/PII detection, redaction and reversible surrogates. No network code."

[features]
default = []
# Neural detector (ONNX Runtime). Off by default so the rules engine builds anywhere.
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
zeroize = "1"
ort = { version = "=2.0.0-rc.13", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
